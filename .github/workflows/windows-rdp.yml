- name: Start Cloudflare Tunnel
  run: |
    Write-Host "============================================"
    Write-Host "🚀 WINDOWS RDP - CLOUDFLARE TUNNEL"
    Write-Host "============================================"
    Write-Host ""
    # تشغيل cloudflared وطباعة الرابط في السجلات
    $process = Start-Process -FilePath "cloudflared" -ArgumentList "tunnel --url tcp://localhost:3389" -PassThru -NoNewWindow -RedirectStandardOutput "cloudflared_output.txt"
    Start-Sleep -Seconds 10
    $output = Get-Content "cloudflared_output.txt" -Raw
    Write-Host "📡 CLOUDFLARE OUTPUT:"
    Write-Host $output
    # استخراج الرابط من المخرجات
    if ($output -match '(https://[a-zA-Z0-9-]+\.trycloudflare\.com)') {
        $url = $matches[1]
        Write-Host "✅ RDP ADDRESS: $url"
    } else {
        Write-Host "⚠️ لم يتم العثور على الرابط في المخرجات"
    }
    Write-Host ""
    Write-Host "📋 CONNECTION DETAILS:"
    Write-Host "   USERNAME: runneradmin"
    Write-Host "   PASSWORD: P@ssw0rd123!"
    Write-Host "   OS: Windows Server 2022"
    Write-Host "   CPU: 4 cores"
    Write-Host "   RAM: 16GB"
    Write-Host "============================================"
